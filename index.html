<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torneo de amigos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#EDF0F4; --paper:#FFFFFF; --ink:#0A1628; --muted:#5E6A7C; --line:#E0E5EC; --soft:#F4F6F9;
  --navy:#041E42; --navy-2:#0B2D5C; --navy-3:#123D78; --navy-ink:#CFDAEA;
  --red:#D0112B; --blue:#0B63CE; --gold:#F2B705; --bogey:#A9C8EE; --dbl:#1D3F78; --bogey-ink:#0A1628;
  --display:"Archivo Narrow","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Archivo","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060C16; --paper:#0E1726; --ink:#E8EEF6; --muted:#8D9AAD; --line:#1F2B3E; --soft:#131F32;
    --navy:#020D1F; --navy-2:#0A1E3D; --navy-3:#123066; --navy-ink:#BFCBDD;
    --red:#FF5061; --blue:#5AA2FF; --gold:#F5C230; --bogey:#5E88BD; --dbl:#2F5FAF; --bogey-ink:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#060C16; --paper:#0E1726; --ink:#E8EEF6; --muted:#8D9AAD; --line:#1F2B3E; --soft:#131F32;
  --navy:#020D1F; --navy-2:#0A1E3D; --navy-3:#123066; --navy-ink:#BFCBDD;
  --red:#FF5061; --blue:#5AA2FF; --gold:#F5C230; --bogey:#5E88BD; --dbl:#2F5FAF; --bogey-ink:#FFFFFF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 1rem}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
.num,.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{background:var(--navy);color:var(--navy-ink)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:64px}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0;padding:.7rem 0}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:24px}
.brand h1{font-size:clamp(1.25rem,4vw,1.7rem);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:.8rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .tx{min-width:0}
.rename{background:none;border:0;color:var(--navy-ink);opacity:.7;padding:.3rem;border-radius:6px;flex:none}
.rename:hover{opacity:1;background:rgba(255,255,255,.08)}
.rename svg{width:16px;height:16px;display:block}
.tabs{display:flex;align-self:stretch}
.tab{border:0;background:transparent;color:var(--navy-ink);padding:0 1rem;font-family:var(--display);font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;position:relative}
.tab:hover{color:#fff}
.tab.on{color:#fff}
.tab.on::after{content:"";position:absolute;left:.8rem;right:.8rem;bottom:0;height:4px;background:#fff;border-radius:3px 3px 0 0}
.bnav{display:none}
@media (max-width:760px){
  .tabs{display:none}
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{flex:1;border:0;background:none;padding:.5rem .1rem .45rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.68rem;font-weight:600;color:var(--muted)}
  .bnav button svg{width:23px;height:23px}
  .bnav button.on{color:var(--blue)}
}

main.wrap{padding-top:1.2rem;padding-bottom:1rem}
section{margin-bottom:1.2rem}
.card{background:var(--paper);border-radius:12px;box-shadow:0 1px 0 var(--line);border:1px solid var(--line);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;padding:.9rem 1rem;border-bottom:1px solid var(--line)}
.card-body{padding:1rem}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:1.6rem 0 .6rem}

/* buttons & fields */
.primary,.ghost,.danger{border-radius:999px;padding:.55rem 1.1rem;font-weight:700;border:1.5px solid transparent;line-height:1.2;font-size:.9rem}
.primary{background:var(--blue);color:#fff}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:var(--paper);border-color:var(--line);color:var(--ink)}
.ghost:hover{border-color:var(--muted)}
.danger{background:var(--red);color:#fff}
.small{padding:.32rem .75rem;font-size:.82rem}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:600}
.link:hover{text-decoration:underline}
.danger-text{color:var(--red)!important}
label.fld{display:flex;flex-direction:column;gap:.25rem;font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:.5rem .65rem;color:var(--ink);min-width:0;font-size:.95rem;font-weight:500}
textarea{resize:vertical;min-height:4.5rem}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:flex-end}
.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:.35rem .85rem;border-radius:999px;font-weight:700;font-size:.82rem}
.seg button.on{background:var(--navy);color:#fff}

/* avatars */
.av{width:var(--s);height:var(--s);border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--c,#56616C);color:#fff;font-family:var(--display);font-weight:700;font-size:calc(var(--s)*.38);letter-spacing:.02em;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}

/* leader spotlight */
.spot{background:var(--navy-2);background-image:linear-gradient(115deg,var(--navy-2) 0%,var(--navy) 70%);color:#fff;border-radius:12px;padding:1.1rem 1.2rem;display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap}
.spot-av{display:flex}
.spot-av .av{border-color:var(--navy-2);box-shadow:none}
.spot-av .av+.av{margin-left:-18px}
.spot-txt{flex:1;min-width:160px}
.kick{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.12);border-radius:4px;padding:.15rem .45rem;margin-bottom:.4rem}
.spot h2{font-size:clamp(1.7rem,5vw,2.4rem);color:#fff}
.spot p{margin:.2rem 0 0;color:var(--navy-ink);font-size:.9rem}
.spot-score{font-family:var(--display);font-weight:700;font-size:clamp(2.8rem,9vw,4rem);line-height:1;font-variant-numeric:tabular-nums}
.spot-score.under{color:#FF5A6A}
@media (max-width:560px){ .spot{flex-wrap:nowrap;gap:.8rem;padding:.9rem} .spot .av{--s:60px!important} .spot-av .av+.av{margin-left:-26px} .spot-txt{min-width:0} .spot h2{font-size:1.45rem} .spot p{font-size:.8rem} .spot-score{font-size:2.3rem} }

/* leaderboard */
table.lb{width:100%;border-collapse:collapse}
.xin{width:0;min-width:100%}
.pl>span{min-width:0;overflow:hidden}
.pl b{white-space:nowrap}
.lb th{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:.55rem .4rem;text-align:center;background:var(--soft);border-bottom:1px solid var(--line)}
.lb th.c-pl{text-align:left}
.lb td{padding:.55rem .4rem;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:600}
.lbrow{cursor:pointer}
.lbrow:hover td{background:var(--soft)}
.lbrow.open td{background:var(--soft);border-bottom-color:transparent}
.c-pos{width:3rem;font-weight:700!important;color:var(--ink)}
.c-pl{text-align:left!important}
.pl{display:flex;align-items:center;gap:.6rem;min-width:0}
.pl b{display:block;font-weight:700;font-size:.98rem;line-height:1.2}
.pl small{display:block;color:var(--muted);font-weight:500;font-size:.75rem}
.c-tot{width:3.6rem;font-family:var(--display);font-size:1.3rem;font-weight:700!important}
.c-thru{width:3.2rem;color:var(--muted);font-weight:600}
.fcol{width:3rem;color:var(--ink)}
.c-str{width:3.6rem;color:var(--muted)}
.under{color:var(--red)!important}
.caret{display:inline-block;width:.5rem;height:.5rem;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:.35rem;transition:transform .2s}
.open .caret{transform:rotate(-135deg)}
.xrow td{background:var(--soft);padding:0 .6rem .9rem;text-align:left;border-bottom:1px solid var(--line)}
.xin{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.8rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.25rem .75rem;font-size:.8rem;font-weight:700;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media (max-width:620px){ .fcol{display:none} .c-str{display:none} }
.idle{margin:0;padding:.7rem 1rem;font-size:.85rem;color:var(--muted)}

/* stats tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:.8rem .95rem;display:flex;flex-direction:column;gap:.1rem}
.tile .lbl{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile b.sm{font-size:1.45rem}
.tile b{font-family:var(--display);font-size:1.9rem;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span.d{font-size:.83rem;color:var(--muted)}
.tile .who{display:flex;align-items:center;gap:.45rem;font-size:.85rem;font-weight:600;margin-top:.2rem}

.list-rows{list-style:none;margin:0;padding:0}
.list-rows li+li{border-top:1px solid var(--line)}
.list-rows button{width:100%;display:flex;align-items:center;gap:.7rem;text-align:left;background:none;border:0;padding:.65rem 1rem}
.list-rows button:hover{background:var(--soft)}
.list-rows .grow{flex:1;min-width:0}
.list-rows .grow b{display:block;font-weight:700}
.list-rows .grow small{color:var(--muted);font-size:.8rem}
.list-rows .sc-r{font-family:var(--display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.list-rows .sc-r small{display:block;font-family:var(--body);font-size:.75rem;color:var(--muted);font-weight:600}

.chron p{margin:0 0 .8rem;max-width:68ch;font-size:1rem}

/* scorecard (PGA style fills) */
.mk{display:inline-grid;place-items:center;width:1.85em;height:1.85em;font-weight:700;font-variant-numeric:tabular-nums}
.m-eagle{background:var(--gold);color:#111;border-radius:50%}
.m-birdie{background:var(--red);color:#fff;border-radius:50%}
.m-bogey{background:var(--bogey);color:var(--bogey-ink);border-radius:3px}
.m-double{background:var(--dbl);color:#fff;border-radius:3px}
.m-ace{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--gold)}
table.sc{border-collapse:collapse;width:100%;min-width:540px;margin-bottom:.8rem;font-size:.9rem}
.sc th,.sc td{text-align:center;padding:.35rem .15rem;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.sc thead th{background:var(--navy);color:#fff;font-weight:700;font-size:.78rem}
.sc thead th:first-child{border-radius:6px 0 0 0}
.sc thead th:last-child{border-radius:0 6px 0 0}
.sc .l{text-align:left;padding-left:.55rem;color:var(--muted);font-weight:600;font-size:.78rem;white-space:nowrap}
.sc thead .l{color:#fff}
.sc td.sum{font-weight:800;background:var(--soft)}
.sc td.si{color:var(--muted);font-size:.78rem}
.legend-marks{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted);align-items:center;font-weight:600}
.legend-marks .mk{width:1.1rem;height:1.1rem;margin-right:.3rem;vertical-align:middle}
.rsum{display:flex;gap:1.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.rsum div span{display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rsum div b{font-family:var(--display);font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}

/* entry */
table.entry{border-collapse:collapse;width:100%;min-width:520px}
.entry th,.entry td{padding:.2rem;text-align:center}
.entry thead th{background:var(--navy);color:#fff;font-size:.8rem;font-weight:700;padding:.35rem .2rem}
.entry thead th:first-child{border-radius:6px 0 0 6px}
.entry thead th:last-child{border-radius:0 6px 6px 0}
.entry .l{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;white-space:nowrap;padding-right:.5rem}
.entry thead .l{color:#fff;padding-left:.55rem}
.entry input{width:100%;max-width:3rem;text-align:center;padding:.3rem .1rem;font-size:1.05rem;font-weight:700;border-radius:6px}
.entry input.in-s{width:2.45rem;height:2.45rem;max-width:none;padding:0}
.entry input.in-p{font-size:.92rem;font-weight:500}
.entry input.m-eagle{background:var(--gold);color:#111;border-color:var(--gold);border-radius:50%}
.entry input.m-birdie{background:var(--red);color:#fff;border-color:var(--red);border-radius:50%}
.entry input.m-bogey{background:var(--bogey);color:var(--bogey-ink);border-color:var(--bogey)}
.entry input.m-double{background:var(--dbl);color:#fff;border-color:var(--dbl)}
.entry td.sum{font-weight:800;font-size:1rem}
.half-title{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:.95rem;margin:1rem 0 .3rem;color:var(--muted)}
.sumbar{display:flex;gap:1.4rem;flex-wrap:wrap;align-items:baseline;background:var(--soft);border-radius:10px;padding:.7rem 1rem;margin:1rem 0}
.sumbar div span{display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sumbar div b{font-family:var(--display);font-size:1.5rem;line-height:1.1}
.photo{border:1.5px dashed var(--line);border-radius:10px;padding:.9rem 1rem;margin-bottom:1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;justify-content:space-between}
.photo p{margin:0;max-width:52ch;font-size:.92rem}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.found{display:grid;gap:.5rem;margin:.6rem 0 1rem}
.found-row{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:.55rem .8rem}
.found-row .nm{font-weight:700;min-width:8rem}
.err{color:var(--red);font-weight:600}

/* players */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1.1rem .9rem .9rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;text-align:center}
.pcard:hover{border-color:var(--blue)}
.pc-name{font-family:var(--display);font-weight:700;font-size:1.25rem;text-transform:uppercase;margin-top:.4rem}
.pc-sub{font-size:.82rem;color:var(--muted);min-height:1.2em}
.pc-stats{display:flex;gap:1.1rem;margin-top:.5rem;border-top:1px solid var(--line);padding-top:.55rem;width:100%;justify-content:center}
.pc-stats span{display:flex;flex-direction:column;font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pc-stats b{font-family:var(--display);font-size:1.25rem;color:var(--ink);letter-spacing:0}
.pcard.add{justify-content:center;border-style:dashed;color:var(--blue);font-weight:700;min-height:190px}
.pcard.add span.plus{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:1.8rem;font-weight:400}
.back{background:none;border:0;color:var(--blue);font-weight:700;padding:.2rem 0;margin-bottom:.7rem;display:inline-flex;align-items:center;gap:.35rem}
.back::before{content:"";width:.5rem;height:.5rem;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}
.phero{background:var(--navy);background-image:linear-gradient(135deg,var(--navy-3) 0%,var(--navy) 60%);color:#fff;border-radius:12px 12px 0 0;padding:1.3rem 1.2rem;display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;position:relative}
.phero .av{border:3px solid rgba(255,255,255,.9);box-shadow:none}
.phero h2{font-size:clamp(1.9rem,6vw,2.8rem);color:#fff}
.phero .nick{margin:.15rem 0 0;color:var(--navy-ink);font-style:italic}
.phero .meta{list-style:none;padding:0;margin:.7rem 0 0;display:flex;flex-wrap:wrap;gap:.4rem 1.2rem}
.phero .meta li{font-size:.85rem;color:var(--navy-ink)}
.phero .meta b{color:#fff;font-weight:700}
.phero-txt{flex:1;min-width:180px}
.phero .edit{position:absolute;top:.9rem;right:.9rem;background:rgba(255,255,255,.12);color:#fff;border:0}
.pstrip{display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px}
.pstrip div{padding:.7rem .5rem;text-align:center}
.pstrip div+div{border-left:1px solid var(--line)}
.pstrip span{display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pstrip b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
@media (max-width:560px){ .pstrip{grid-template-columns:repeat(3,1fr)} .pstrip div:nth-child(n+4){border-top:1px solid var(--line)} .pstrip div:nth-child(4){border-left:0} }
.subtabs{display:flex;gap:.2rem;border-bottom:1px solid var(--line);margin:1.1rem 0 1rem;overflow-x:auto}
.subtabs button{border:0;background:none;padding:.6rem .9rem;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:.95rem;color:var(--muted);position:relative;flex:none}
.subtabs button.on{color:var(--ink)}
.subtabs button.on::after{content:"";position:absolute;left:.6rem;right:.6rem;bottom:-1px;height:3px;background:var(--blue);border-radius:2px}
.bio{font-size:1rem;max-width:65ch;margin:0}

/* bag / distances */
.bag{display:grid;gap:.45rem}
.bag-row{display:grid;grid-template-columns:7.2rem 1fr 3.4rem;gap:.7rem;align-items:center}
.bag-l{font-weight:700;font-size:.88rem;white-space:nowrap}
.bag-track{position:relative;height:22px;background:var(--soft);border-radius:4px}
.bag-range{position:absolute;top:5px;bottom:5px;background:var(--bogey);border-radius:3px;min-width:4px;opacity:.9}
.bag-avg{position:absolute;top:1px;bottom:1px;width:4px;margin-left:-2px;background:var(--navy);border-radius:2px}
:root[data-theme="dark"] .bag-avg{background:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bag-avg{background:#fff} }
.bag-v{font-family:var(--display);font-weight:700;font-size:1.2rem;text-align:right;font-variant-numeric:tabular-nums}
.bag-v small{font-family:var(--body);font-size:.65rem;color:var(--muted);font-weight:600}
.bag-axis{position:relative;height:1.1rem;margin-left:7.9rem;margin-right:4.1rem;font-size:.7rem;color:var(--muted)}
.bag-axis span{position:absolute;transform:translateX(-50%)}
.bag-keys{display:flex;gap:1rem;font-size:.78rem;color:var(--muted);margin-top:.5rem;flex-wrap:wrap}
.bag-keys i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:.3rem;vertical-align:middle}

function rcv(hcp, si){ var h = Math.max(0, Math.round(Number(hcp) || 0)); return Math.floor(h / 18) + ((si || 18) <= h % 18 ? 1 : 0); }

  var c = course(r.courseId), p = player(r.playerId);

  if (!c) return res;
  for (var i = 0; i < 18; i++) {
    var s = r.scores && r.scores[i];
    if (!isNum(s)) continue;
    var par = c.pars[i], k = rcv(p ? p.hcp : 0, c.si[i]);
    res.holes++; res.gross += s; res.par += par; res.net += s - k;
    res.pts += Math.max(0, 2 + par + k - s);
    if (i < 9) res.front += s; else res.back += s;
    if (r.putts && isNum(r.putts[i])) { res.putts += r.putts[i]; res.puttHoles++; }
  }

var CALC = new WeakMap();

function sortRounds(a, b){ return String(a.date || '').localeCompare(String(b.date || '')) || (a.fecha - b.fecha) || ((a.ts || 0) - (b.ts || 0)); }
function roundFor(pid, tid, n){
  var rs = S.rounds.filter(function(r){ return r.playerId === pid && r.tid === tid && r.fecha === n; });
  rs.sort(function(a, b){ return (a.ts || 0) - (b.ts || 0); });
  return rs.length ? rs[rs.length - 1] : null;
}
function markCls(s, par){

function metric(x, mode){ return mode === 'stableford' ? -x.c.pts : mode === 'net' ? x.c.net - x.c.par : x.c.gross - x.c.par; }
function leaderboard(mode, tid){
  var t = tour(tid);
  if (!t) return { t: null, n: 0, rows: [], idle: S.players.slice() };
  var n = t.rounds.length;
  var rows = S.players.map(function(p){
    var cells = [];
    for (var i = 0; i < n; i++) { var r = roundFor(p.id, t.id, i + 1); cells.push(r ? { r: r, c: calc(r), counts: t.rounds[i].counts !== false, used: false } : null); }
    var countable = cells.filter(function(x){ return x && x.counts; });
    var chosen = countable;
    if (t.bestN > 0 && countable.length > t.bestN) chosen = countable.slice().sort(function(a, b){ return metric(a, mode) - metric(b, mode); }).slice(0, t.bestN);
    chosen.forEach(function(x){ x.used = true; });
    var o = { p: p, cells: cells, total: 0, toPar: 0, pts: 0, holes: 0, counted: chosen.length, played: cells.filter(Boolean).length };
    chosen.forEach(function(x){
      o.holes += x.c.holes; o.pts += x.c.pts;
      var v = mode === 'net' ? x.c.net : x.c.gross;
      o.total += v; o.toPar += v - x.c.par;
    });
    return o;
  }).filter(function(o){ return o.played > 0; });
  var ranked = rows.filter(function(o){ return o.counted > 0; });
  var rest = rows.filter(function(o){ return o.counted === 0; });
  ranked.sort(mode === 'stableford'
    ? function(a, b){ return (b.pts - a.pts) || a.p.name.localeCompare(b.p.name); }
    : function(a, b){ return (a.toPar - b.toPar) || (b.holes - a.holes) || a.p.name.localeCompare(b.p.name); });
  var key = function(r){ return mode === 'stableford' ? r.pts : r.toPar; };
  ranked.forEach(function(r, i){ r.pos = (i > 0 && key(ranked[i-1]) === key(r)) ? ranked[i-1].pos : i + 1; });
  ranked.forEach(function(r){ r.tie = ranked.filter(function(x){ return x.pos === r.pos; }).length > 1; });
  rest.forEach(function(r){ r.pos = null; });
  var all = ranked.concat(rest);
  var idle = S.players.filter(function(p){ return !all.some(function(r){ return r.p === p; }); });

}
function scoreText(r, mode){ return mode === 'stableford' ? r.pts + ' pts' : fmtPar(r.toPar) + ' (' + r.total + ')'; }
function aggregate(rounds){
  var a = { rounds: 0, complete: 0, grossSum: 0, best: null, bestRound: null, holes: 0, overSum: 0,
    dist: { eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0 }, byPar: { 3: [0,0], 4: [0,0], 5: [0,0] },
    putts: 0, puttRounds: 0, front: 0, back: 0, halves: 0, aces: 0 };
  rounds.forEach(function(r){
    var c = course(r.courseId); if (!c) return;
    var k = calc(r); a.rounds++;
    for (var i = 0; i < 18; i++) {
      var s = r.scores[i]; if (!isNum(s)) continue;
      var par = c.pars[i], d = s - par;
      a.holes++; a.overSum += d;
      if (d <= -2) a.dist.eagle++; else if (d === -1) a.dist.birdie++; else if (d === 0) a.dist.par++; else if (d === 1) a.dist.bogey++; else a.dist.double++;
      if (a.byPar[par]) { a.byPar[par][0] += s; a.byPar[par][1]++; }
      if (s === 1) a.aces++;

    if (k.complete) {
      a.complete++; a.grossSum += k.gross;
      if (a.best === null || k.gross < a.best) { a.best = k.gross; a.bestRound = r; }
      a.front += k.front; a.back += k.back; a.halves++;

function tourFacts(rounds){

  rounds.forEach(function(r){
    var c = course(r.courseId); if (!c) return;
    var k = calc(r);
    if (k.complete && (f.best === null || k.gross < f.best)) { f.best = k.gross; f.bestR = r; }
    for (var i = 0; i < 18; i++) {
      var s = r.scores[i]; if (!isNum(s)) continue;
      var d = s - c.pars[i];
      if (d === -1) f.birdies[r.playerId] = (f.birdies[r.playerId] || 0) + 1;
      if (d <= -2) f.eagles++;
      if (s === 1) f.aces.push(r);
    }
  });
  f.topB = Object.keys(f.birdies).sort(function(x, y){ return f.birdies[y] - f.birdies[x]; })[0] || null;
  f.avg = avg(a.grossSum, a.complete);
  f.cards = rounds.length;

}

    return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok) { var e = new Error(j.error || 'http'); e.code = j.error || 'http'; throw e; } return j; });
  });

    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { status: r.status, body: j }; }); });

function setBusy(on){

function commit(mutate, flash){

    setBusy(false); render(); if (flash) toast(flash); return true;

    toast(c === 'too_large' ? 'Los datos superaron el tamaño máximo. Probá con fotos de perfil más livianas.'
      : c === 'apply' ? 'Otra persona cambió eso mismo recién. Ya cargué su versión: revisá y volvé a intentar.'
      : c === 'net' ? 'Sin conexión. Revisá internet y volvé a intentar.'
      : 'No se pudo guardar. Volvé a intentar.');

}
function roundSummary(r){
  var k = calc(r);
  return '<div class="rsum"><div><span>Gross</span><b class="' + parCls(k.gross - k.par) + '">' + k.gross + ' (' + fmtPar(k.gross - k.par) + ')</b></div><div><span>Neto</span><b>' + k.net + '</b></div><div><span>Stableford</span><b>' + k.pts + '</b></div>' + (k.puttHoles ? '<div><span>Putts</span><b>' + k.putts + '</b></div>' : '') + (k.complete ? '' : '<div><span>Hoyos</span><b>' + k.holes + '</b></div>') + '</div>';
}
function cardTables(r){
  var c = course(r.courseId), p = player(r.playerId);
  if (!c) return '<p>Esta tarjeta es de una cancha que ya no existe.</p>';
  var h = '';
  [[0,'Ida'],[9,'Vuelta']].forEach(function(hf){
    var a = hf[0], idx = [0,1,2,3,4,5,6,7,8].map(function(i){ return i + a; });
    var sc = idx.map(function(i){ return r.scores[i]; }), pt = idx.map(function(i){ return r.putts ? r.putts[i] : null; });
    var pts = idx.map(function(i){ var s = r.scores[i]; if (!isNum(s)) return null; return Math.max(0, 2 + c.pars[i] + rcv(p ? p.hcp : 0, c.si[i]) - s); });
    h += '<div class="hscroll"><table class="sc"><thead><tr><th class="l">Hoyo</th>' + idx.map(function(i){ return '<th>' + (i + 1) + '</th>'; }).join('') + '<th>' + hf[1] + '</th></tr></thead><tbody>' +
      '<tr><td class="l">Par</td>' + idx.map(function(i){ return '<td>' + c.pars[i] + '</td>'; }).join('') + '<td class="sum">' + sum(idx.map(function(i){ return c.pars[i]; })) + '</td></tr>' +
      '<tr><td class="l">Hcp</td>' + idx.map(function(i){ return '<td class="si">' + c.si[i] + '</td>'; }).join('') + '<td class="sum"></td></tr>' +
      '<tr><td class="l">Golpes</td>' + idx.map(function(i){ var s = r.scores[i]; return '<td>' + (isNum(s) ? '<span class="mk ' + markCls(s, c.pars[i]) + '">' + s + '</span>' : '<span class="muted">·</span>') + '</td>'; }).join('') + '<td class="sum">' + (sum(sc) || '–') + '</td></tr>' +
      '<tr><td class="l">Putts</td>' + pt.map(function(v){ return '<td>' + (isNum(v) ? v : '') + '</td>'; }).join('') + '<td class="sum">' + (sum(pt) || '') + '</td></tr>' +
      '<tr><td class="l">Puntos</td>' + pts.map(function(v){ return '<td>' + (isNum(v) ? v : '') + '</td>'; }).join('') + '<td class="sum">' + sum(pts) + '</td></tr>' +
      '</tbody></table></div>';
  });
  return h;
}
function openCard(id){
  var r = byId(S.rounds, id); if (!r) return;
  var p = player(r.playerId), c = course(r.courseId), t = tour(r.tid);
  var h = '<div class="modal-head"><div class="who">' + avatar(p, 48) + '<div><h2>' + esc(p ? p.name : 'Jugador borrado') + '</h2><p>' + (t ? esc(t.name) + ', ronda ' + r.fecha : 'Ronda libre, no cuenta para ningún torneo') + (c ? ', ' + esc(c.name) : '') + (r.date ? ', ' + fmtDate(r.date) : '') + (p ? '. Hándicap ' + esc(p.hcp) : '') + '</p></div></div><button class="x" data-m="no" aria-label="Cerrar">×</button></div>';
  h += roundSummary(r) + cardTables(r) + legendMarks();

  openModal(h);
}

/* ---------- Cargar ---------- */
function openTours(){ return S.tournaments.filter(function(t){ return t.status !== 'finalizado'; }); }
function suggestRound(t, pid){
  for (var i = 1; i <= t.rounds.length; i++) if (!roundFor(pid, t.id, i)) return i;
  return t.rounds.length || 1;
}
function newForm(){
  var t = curTour();
  if (t && t.status === 'finalizado') t = openTours()[0] || null;
  var pid = S.players[0] ? S.players[0].id : '';
  if (!t) return { id: null, tid: '', courseId: S.courses[0] ? S.courses[0].id : '', playerId: pid, fecha: 0, date: today(), scores: new Array(18).fill(null), putts: new Array(18).fill(null) };
  var n = suggestRound(t, pid);
  var rd = t.rounds[n - 1];
  return { id: null, tid: t.id, courseId: t.courseId, playerId: pid, fecha: n, date: rd && rd.date ? rd.date : today(), scores: new Array(18).fill(null), putts: new Array(18).fill(null) };
}
function formCourse(){
  if (!ui.form) return null;
  var t = ui.form.tid ? tour(ui.form.tid) : null;
  return t ? course(t.courseId) : course(ui.form.courseId);
}

       : '<label class="fld">Cancha<select data-f="courseId">' + S.courses.map(function(x){ return '<option value="' + x.id + '"' + (x.id === f.courseId ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></label>') +
    '<label class="fld">Jugador<select data-f="playerId">' + S.players.map(function(p){ return '<option value="' + p.id + '"' + (p.id === f.playerId ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') + '</select></label>' +

      '<tr><td class="l">Par</td>' + idx.map(function(i){ return '<td>' + c.pars[i] + '</td>'; }).join('') + '<td class="sum">' + sum(idx.map(function(i){ return c.pars[i]; })) + '</td></tr>' +

      '</tbody></table></div>';

  h += '<div class="sumbar" id="form-sum" aria-live="polite"></div>';

function updateFormLive(){
  var f = ui.form, c = formCourse(); if (!c) return;
  [0, 9].forEach(function(a){
    var ss = 0, pp = 0;
    for (var i = a; i < a + 9; i++) { if (isNum(f.scores[i])) ss += f.scores[i]; if (isNum(f.putts[i])) pp += f.putts[i]; }
    var e1 = $('#sum-s-' + a), e2 = $('#sum-p-' + a);
    if (e1) e1.textContent = ss || '';
    if (e2) e2.textContent = pp || '';
  });
  var k = roundCalc({ courseId: c.id, playerId: f.playerId, scores: f.scores, putts: f.putts }), el = $('#form-sum'); if (!el) return;
  el.innerHTML = k.holes ? '<div><span>Hoyos</span><b>' + k.holes + '/18</b></div><div><span>Gross</span><b class="' + parCls(k.gross - k.par) + '">' + k.gross + ' (' + fmtPar(k.gross - k.par) + ')</b></div><div><span>Neto</span><b>' + k.net + '</b></div><div><span>Stableford</span><b>' + k.pts + '</b></div>' + (k.puttHoles ? '<div><span>Putts</span><b>' + k.putts + '</b></div>' : '')
    : '<span class="muted">Escribí los golpes de cada hoyo. Con 2 a 9 golpes el cursor pasa solo al hoyo siguiente.</span>';
}
function photoHtml(){
  if (!sampleNS || !canImages) return '';
  var p = ui.photo;
  var h = '<div class="photo"><p><b>¿Tenés una foto de la tarjeta?</b> Claude lee los golpes de cada jugador y completa el formulario. Elegí primero el torneo y la ronda, o la cancha si es una ronda libre.</p>';
  if (p && p.status === 'reading') h += '<div class="row"><span class="muted">Leyendo la tarjeta…</span><button class="ghost small" data-action="photo-cancel">Cancelar</button></div>';
  else h += '<span class="filebtn"><span class="primary" style="display:inline-block">Subir foto de tarjeta</span><input type="file" id="photo-file" accept="image/jpeg,image/png,image/webp" aria-label="Subir foto de la tarjeta"></span>';
  h += '</div>';
  if (p && p.status === 'error') h += '<p class="err">' + esc(p.msg) + '</p>';
  if (p && p.status === 'done') {
    h += '<p><b>' + plural(p.found.length, 'jugador encontrado', 'jugadores encontrados') + ' en la foto.</b> Revisá a quién corresponde cada fila.</p><div class="found">' + p.found.map(function(x, i){
      var tot = sum(x.scores), n = x.scores.filter(isNum).length;
      return '<div class="found-row"><span class="nm">' + esc(x.name) + '</span><select data-photo="' + i + '" aria-label="Jugador para ' + esc(x.name) + '"><option value="">No guardar</option>' + S.players.map(function(pl){ return '<option value="' + pl.id + '"' + (pl.id === x.playerId ? ' selected' : '') + '>' + esc(pl.name) + '</option>'; }).join('') + '</select><span class="muted">' + tot + ' golpes en ' + n + ' hoyos</span><button class="ghost small" data-action="photo-use" data-i="' + i + '">Pasar al formulario</button></div>';
    }).join('') + '</div><div class="row" style="margin-bottom:1.2rem"><button class="primary" data-action="photo-save-all">Guardar las tarjetas asignadas</button><button class="link" data-action="photo-clear">Descartar lectura</button></div>';
  }
  return h;

function cleanArr(a, lo, hi){
  var out = new Array(18).fill(null);
  if (Array.isArray(a)) for (var i = 0; i < 18; i++) { var v = Number(a[i]); if (a[i] !== null && a[i] !== '' && Number.isInteger(v) && v >= lo && v <= hi) out[i] = v; }
  return out;
}
function matchPlayer(name){
  var n = norm(name); if (!n) return '';
  var p = S.players.find(function(x){ return norm(x.name) === n || norm(x.nick) === n; }) ||
    S.players.find(function(x){ var a = norm(x.name); return a.indexOf(n) === 0 || n.indexOf(a) === 0; }) ||
    S.players.find(function(x){ var a = norm(x.name).split(' ')[0]; return a && n.split(' ').indexOf(a) >= 0; });
  return p ? p.id : '';
}
function readPhoto(file){
  if (!file || !sampleNS) return;
  var c = formCourse();
  var ctl = new AbortController();
  ui.photo = { status: 'reading', ctl: ctl };
  render();
  var prompt = 'La imagen es la foto de una tarjeta de golf de 18 hoyos. Leé los golpes por hoyo (y los putts, si están anotados) de cada jugador que aparezca.\n' +
    'Nombres de los jugadores del torneo, para ayudarte a leer la letra: ' + S.players.map(function(p){ return p.name + (p.nick ? ' (' + p.nick + ')' : ''); }).join(', ') + '.\n' +
    'Pares de la cancha, hoyos 1 a 18: ' + (c ? c.pars.join(', ') : 'desconocidos') + '.\n' +
    'Reglas: no inventes números. Si un hoyo no se lee o está vacío, usá null. No confundas las filas de par, hándicap o distancias con los golpes de un jugador. No incluyas los totales de ida, vuelta ni total.\n' +
    'Respondé solo con JSON con esta forma: {"players":[{"name":"nombre como figura en la tarjeta","scores":[18 enteros o null],"putts":[18 enteros o null]}]}';
  sampleNS.json(prompt, { images: [file], signal: ctl.signal }).then(function(res){
    var list = res && Array.isArray(res.players) ? res.players : [];
    var found = list.map(function(x){ return { name: String(x && x.name || 'Sin nombre'), scores: cleanArr(x && x.scores, 1, 20), putts: cleanArr(x && x.putts, 0, 9) }; })
      .filter(function(x){ return x.scores.some(isNum); });
    var used = {};
    found.forEach(function(x){ var id = matchPlayer(x.name); if (id && !used[id]) { x.playerId = id; used[id] = 1; } else x.playerId = ''; });
    ui.photo = found.length ? { status: 'done', found: found } : { status: 'error', msg: 'No encontré golpes legibles en la foto. Probá con una foto más de frente y con buena luz.' };
    if (found.length === 1) usePhotoRow(0, true);
    render();
  }, function(e){
    var code = e && e.code;
    if (code === 'cancelled') { ui.photo = null; render(); return; }
    var msg = code === 'not_granted' || code === 'sampling_disabled' ? 'La lectura de fotos no está habilitada en esta vista.'
      : code === 'image_rejected' ? 'Esa imagen no se pudo leer. Probá con un JPG o PNG más chico.'
      : code === 'rate_limited' ? 'Se alcanzó el límite de uso por ahora. Probá de nuevo en un rato.'
      : code === 'invalid_json' ? 'No pude interpretar la tarjeta. Probá con otra foto.'
      : 'No se pudo leer la foto. Volvé a intentar.';
    if (code === 'not_granted' || code === 'sampling_disabled' || code === 'images_unavailable') canImages = false;
    ui.photo = { status: 'error', msg: msg };
    render();
  });
}
function usePhotoRow(i, silent){
  var x = ui.photo && ui.photo.found[i]; if (!x) return;
  ui.form.scores = x.scores.slice();
  ui.form.putts = x.putts.slice();
  if (x.playerId) ui.form.playerId = x.playerId;
  if (!silent) { render(); toast('Golpes de ' + x.name + ' pasados al formulario. Revisalos y guardá.'); }
}
function upsertRound(st, rec){
  var i = st.rounds.findIndex(function(r){ return r.id === rec.id; });
  if (i < 0 && rec.tid) i = st.rounds.findIndex(function(r){ return r.playerId === rec.playerId && r.tid === rec.tid && r.fecha === rec.fecha; });
  if (i >= 0) { rec.id = st.rounds[i].id; st.rounds[i] = rec; } else st.rounds.push(rec);
}
function makeRec(f, t, pid, scores, putts, id, ts){
  var fecha = t ? Math.round(Number(f.fecha)) : 0;
  var rec = { id: id || uid(), tid: t ? t.id : '', playerId: pid, courseId: t ? t.courseId : f.courseId, fecha: fecha, date: f.date || '', scores: scores.slice(), putts: putts.slice(), ts: ts || Date.now() };
  if (!t) rec.free = true;
  return rec;
}
function afterSaveNav(rec){
  ui.form = null; ui.photo = null;
  if (rec.tid) { ui.tab = 'tabla'; ui.tid = rec.tid; ui.expand = rec.playerId; ui.expandF = rec.fecha; }
  else { ui.tab = 'jugadores'; ui.profile = rec.playerId; ui.ptab = 'tarjetas'; }
}
function saveRound(){
  var f = ui.form, t = f.tid ? tour(f.tid) : null, fecha = Math.round(Number(f.fecha));
  if (!player(f.playerId)) { toast('Elegí el jugador.'); return; }
  if (t && !course(t.courseId)) { toast('La cancha de ese torneo ya no existe.'); return; }
  if (!t && !course(f.courseId)) { toast('Elegí la cancha.'); return; }
  if (t && !(fecha >= 1 && fecha <= t.rounds.length)) { toast('Elegí una ronda del torneo.'); return; }
  if (!f.scores.some(isNum)) { toast('Cargá los golpes de al menos un hoyo.'); return; }
  var dup = t ? S.rounds.find(function(r){ return r.id !== f.id && r.playerId === f.playerId && r.tid === t.id && r.fecha === fecha; }) : null;
  var go = function(){
    var rec = makeRec(f, t, f.playerId, f.scores, f.putts, f.id);
    afterSaveNav(rec);
    commit(function(st){
      if (dup) st.rounds = st.rounds.filter(function(r){ return r.id !== dup.id; });
      upsertRound(st, rec);
    }, t ? 'Tarjeta guardada' : 'Ronda libre guardada');
  };
  if (dup) askConfirm('Ya hay una tarjeta', player(f.playerId).name + ' ya tiene una tarjeta en la ronda ' + fecha + ' de este torneo. Si guardás, se reemplaza.', 'Reemplazar').then(function(ok){ if (ok) go(); });
  else go();
}
function savePhotoAll(){
  var f = ui.form, t = f.tid ? tour(f.tid) : null;
  var rows = (ui.photo && ui.photo.found || []).filter(function(x){ return x.playerId; });
  if (!rows.length) { toast('Asigná al menos una fila a un jugador.'); return; }
  if (!t && !course(f.courseId)) { toast('Elegí la cancha.'); return; }
  var ids = rows.map(function(x){ return x.playerId; });
  if (ids.some(function(id, i){ return ids.indexOf(id) !== i; })) { toast('Hay dos filas asignadas al mismo jugador.'); return; }
  var recs = rows.map(function(x, i){ return makeRec(f, t, x.playerId, x.scores, x.putts, null, Date.now() + i); });
  ui.form = null; ui.photo = null;
  if (t) { ui.tab = 'tabla'; ui.tid = t.id; } else { ui.tab = 'torneos'; }
  commit(function(st){ recs.forEach(function(r){ upsertRound(st, r); }); }, plural(recs.length, 'tarjeta guardada', 'tarjetas guardadas'));
}

function viewProfile(p){

  var a = aggregate(rs);
  var bag = bagFor(p.id), dr = bag[0];
  var ti = titlesOf(p.id);
  var meta = [['Hándicap', p.hcp], ['Club', p.club], ['Juega', p.hand], ['Palo favorito', clubLabel(p.fav)]].filter(function(x){ return x[1] !== '' && x[1] != null; });

function readAsDataURL(file){ return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = rej; r.readAsDataURL(file); }); }
function processPhoto(file){
  return readAsDataURL(file).then(function(src){
    return new Promise(function(res, rej){
      var img = new Image();
      img.onload = function(){
        var N = 240, cv = document.createElement('canvas'); cv.width = cv.height = N;
        var x = cv.getContext('2d'), m = Math.min(img.naturalWidth, img.naturalHeight);
        x.fillStyle = '#fff'; x.fillRect(0, 0, N, N);
        x.drawImage(img, (img.naturalWidth - m) / 2, (img.naturalHeight - m) / 2, m, m, 0, 0, N, N);
        var q = 0.82, d = cv.toDataURL('image/jpeg', q);
        while (d.length > 45000 && q > 0.4) { q -= 0.1; d = cv.toDataURL('image/jpeg', q); }
        res(d);
      };
      img.onerror = rej;
      img.src = src;
    });
  });
}

function sideIds(m, s){ return (s === 'A' ? m.a : m.b).filter(Boolean); }
function sideName(ids, short){
  return ids.map(function(id){ var p = player(id); return p ? (short && p.nick ? p.nick : p.name) : 'Jugador borrado'; }).join(' / ');
}
function sideInitials(ids){ return ids.map(function(id){ var p = player(id); return p ? String(p.name).trim().slice(0, 2).toUpperCase() : '?'; }).join('/'); }
function matchResult(m){
  var n = m.holesN === 9 ? 9 : 18;
  if (m.entry === 'final') {
    var w = m.final && m.final.winner;
    if (!w) return { done: false, winner: null, text: 'Sin resultado', decidedAt: null, played: 0, n: n };
    return { done: true, winner: w, text: w === 'H' ? 'Empate' : (m.final.margin || 'Ganó'), decidedAt: null, played: n, n: n };
  }
  var diff = 0, played = 0, decidedAt = null, run = [];
  for (var i = 0; i < n; i++) {
    var r = m.res && m.res[i];
    if (decidedAt !== null || !r) { run.push(null); continue; }
    played++;
    if (r === 'A') diff++; else if (r === 'B') diff--;
    run.push(diff);
    if (Math.abs(diff) > n - played) decidedAt = i;
  }
  if (decidedAt !== null) {
    var rem = n - played;
    return { done: true, winner: diff > 0 ? 'A' : 'B', text: rem ? Math.abs(diff) + '&' + rem : Math.abs(diff) + ' UP', decidedAt: decidedAt, played: played, n: n, run: run, diff: diff };
  }
  if (played === n) return { done: true, winner: 'H', text: 'Empate', decidedAt: n - 1, played: played, n: n, run: run, diff: 0 };
  return { done: false, winner: null, text: played ? (diff === 0 ? 'AS' : Math.abs(diff) + ' UP') + ' tras ' + played : 'Sin empezar', leader: diff > 0 ? 'A' : diff < 0 ? 'B' : null, decidedAt: null, played: played, n: n, run: run, diff: diff };
}
function runLabel(v, la, lb){ return v === null || v === undefined ? '' : v === 0 ? 'AS' : (v > 0 ? (la || 'A') : (lb || 'B')) + ' ' + Math.abs(v) + 'UP'; }
function mpStats(){
  var rec = {}, h2h = {}, pairs = {};
  function R(id){ return rec[id] = rec[id] || { w: 0, d: 0, l: 0, w1: 0, d1: 0, l1: 0, w2: 0, d2: 0, l2: 0 }; }
  S.matches.forEach(function(m){
    var r = matchResult(m); if (!r.done) return;
    var two = m.format === '2v2';
    ['A','B'].forEach(function(s){
      var mine = sideIds(m, s), other = sideIds(m, s === 'A' ? 'B' : 'A');
      var out = r.winner === 'H' ? 'd' : r.winner === s ? 'w' : 'l';
      mine.forEach(function(id){
        var x = R(id); x[out]++; x[out + (two ? '2' : '1')]++;
        other.forEach(function(o){
          var k = id + '|' + o; var y = h2h[k] = h2h[k] || { w: 0, d: 0, l: 0, list: [] };
          y[out]++; y.list.push(m);
        });
      });
      if (two && mine.length === 2) {
        var pk = mine.slice().sort().join('|'); var z = pairs[pk] = pairs[pk] || { ids: mine.slice().sort(), w: 0, d: 0, l: 0 };
        z[out]++;
      }
    });
  });
  return { rec: rec, h2h: h2h, pairs: pairs };
}

function lineChart(series){
  var xs = [], labels = {};
  series.forEach(function(s){ s.points.forEach(function(p){ if (xs.indexOf(p.x) < 0) { xs.push(p.x); labels[p.x] = p.label; } }); });
  xs.sort();
  if (!xs.length) return '<p class="muted" style="margin:0">Todavía no hay rondas completas de 18 hoyos.</p>';
  var ys = []; series.forEach(function(s){ s.points.forEach(function(p){ ys.push(p.y); }); });
  var min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
  if (max - min < 6) { var m = (max + min) / 2; min = m - 3; max = m + 3; }
  min = Math.floor(min - 1); max = Math.ceil(max + 1);
  var W = 560, H = 250, L = 40, R = 18, T = 14, B = 32;
  function X(x){ var i = xs.indexOf(x); return xs.length === 1 ? L + (W - L - R) / 2 : L + (W - L - R) * i / (xs.length - 1); }
  function Y(v){ return T + (H - T - B) * (max - v) / (max - min); }
  var step = [1, 2, 5, 10, 20].find(function(s){ return (max - min) / s <= 6; }) || 20;
  var every = Math.max(1, Math.ceil(xs.length / 8));
  var g = '';
  for (var v = Math.ceil(min / step) * step; v <= max; v += step) g += '<line class="ax" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="axt" x="' + (L - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + v + '</text>';
  xs.forEach(function(x, i){ if (i % every === 0 || i === xs.length - 1) g += '<text class="axt" x="' + X(x) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(labels[x]) + '</text>'; });
  series.forEach(function(s){
    var pts = s.points.map(function(p){ return X(p.x) + ',' + Y(p.y); }).join(' ');
    g += '<polyline points="' + pts + '" fill="none" style="stroke:' + s.color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    s.points.forEach(function(p){ g += '<circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="4.5" style="fill:' + s.color + '"><title>' + esc(s.name + ', ' + (p.info || '') + ': ' + p.y) + '</title></circle>'; });
  });
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Golpes totales por ronda">' + g + '</svg>' +
    (series.length > 1 ? '<div class="legend">' + series.map(function(s){ return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>'; }).join('') + '</div>' : '') + '</div>';
}
function holeChart(c, rs){
  var vals = [];
  for (var i = 0; i < 18; i++) {
    var s = 0, n = 0;
    rs.forEach(function(r){ var v = r.scores[i]; if (isNum(v)) { s += v - c.pars[i]; n++; } });
    vals.push(n ? s / n : null);
  }
  if (!vals.some(isNum)) return '<p class="muted">Sin datos en esta cancha.</p>';
  var mx = Math.max(1, Math.max.apply(null, vals.filter(isNum).map(Math.abs)));
  var W = 560, H = 240, L = 10, R = 10, T = 22, B = 28;
  var bw = (W - L - R) / 18;
  var hasNeg = vals.some(function(v){ return isNum(v) && v < 0; });
  var zero = hasNeg ? T + (H - T - B) * 0.72 : H - B;
  var scale = (zero - T) / mx;
  var worst = vals.indexOf(Math.max.apply(null, vals.filter(isNum)));
  var g = '<line class="zero" x1="' + L + '" x2="' + (W - R) + '" y1="' + zero + '" y2="' + zero + '"/>';
  vals.forEach(function(v, i){
    var x = L + i * bw + bw * 0.15, w = bw * 0.7;
    g += '<text class="axt" x="' + (x + w / 2) + '" y="' + (H - 8) + '" text-anchor="middle"' + (i === worst ? ' style="font-weight:800;fill:var(--ink)"' : '') + '>' + (i + 1) + '</text>';
    if (!isNum(v)) return;
    var hgt = Math.max(1, Math.abs(v) * scale), y = v >= 0 ? zero - hgt : zero;
    g += '<rect class="' + (v >= 0 ? 'bover' : 'bunder') + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + hgt + '" rx="2"><title>Hoyo ' + (i + 1) + ' (par ' + c.pars[i] + '): ' + (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + ' de promedio</title></rect>';
    g += '<text class="vlab" x="' + (x + w / 2) + '" y="' + (v >= 0 ? y - 4 : y + hgt + 11) + '" text-anchor="middle">' + (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1).replace('.', ',') + '</text>';
  });
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Promedio sobre el par por hoyo en ' + esc(c.name) + '">' + g + '</svg></div>';
}

  'edit-course': function(b){ var c = course(b.dataset.id); if (!c) return; ui.tForm = null; ui.courseForm = clone(c); render(); window.scrollTo(0, 0); },

  'tour-cancel': function(){ ui.tForm = null; render(); },
  'tour-save': function(){ saveTour(); },
  'tour-finish': function(b){

    var lb = leaderboard(t.mode, t.id), w = lb.rows.filter(function(r){ return r.pos === 1; });
    askConfirm('Finalizar ' + t.name, 'Se corona campeón a ' + w.map(function(r){ return r.p.name; }).join(' y ') + ' según la modalidad ' + MODE_LABEL[t.mode].toLowerCase() + ' y el torneo pasa a Campeones. Después podés reabrirlo.', 'Finalizar torneo', true).then(function(ok){

  },
  'tour-reopen': function(b){ var id = b.dataset.id; ui.tForm = null; commit(function(st){ var x = st.tournaments.find(function(y){ return y.id === id; }); x.status = 'activo'; delete x.result; }, 'Torneo reabierto'); },
  'tour-del': function(b){
    var id = b.dataset.id, t = tour(id), n = tourRounds(id).length;
    askConfirm('Eliminar ' + t.name, n ? 'También se borran sus ' + plural(n, 'tarjeta', 'tarjetas') + '. Si ya tenía campeón, deja de figurar.' : 'Todavía no tiene tarjetas.', 'Eliminar').then(function(ok){

    });
  },
  'hist-new': function(){ openHistEditor(null); },
  'hist-edit': function(b){ var x = byId(S.history, b.dataset.id); if (x) openHistEditor(x); },
  'hist-save': function(){ saveHist(); },
  'hist-del': function(){
    var id = ui.he && ui.he.id; if (!id) return;
    ui.he = null;
    askConfirm('Eliminar campeón', 'Se quita este campeón del historial.', 'Eliminar').then(function(ok){ if (ok) commit(function(st){ st.history = st.history.filter(function(x){ return x.id !== id; }); }, 'Campeón eliminado'); });
  },
  'load-demo': function(){ var d = demoData(); ui.tid = null; ui.mode = null; commit(function(st){ Object.keys(d).forEach(function(k){ st[k] = d[k]; }); }, 'Datos de ejemplo cargados'); },
  'reset-all': function(){
    askConfirm('Borrar todo', 'Se eliminan jugadores, canchas, torneos, tarjetas, distancias, partidos y campeones. No se puede deshacer.', 'Borrar todo').then(function(ok){
      if (ok) { ui.form = null; ui.tab = 'tabla'; ui.profile = null; ui.tid = null; commit(function(st){ st.players = []; st.courses = []; st.rounds = []; st.shots = []; st.tournaments = []; st.history = []; st.matches = []; }, 'Datos borrados'); }
    });
  },
  rename: function(){
    openModal('<h3>Nombre del grupo</h3><p class="muted" style="margin:.3rem 0 0;font-size:.88rem">Es el título de la página. Cada torneo tiene su propio nombre.</p><label class="fld" style="margin:1rem 0">Nombre<input type="text" id="rn" maxlength="60" value="' + esc(S.name) + '"></label><div class="actions"><button class="ghost" data-m="no">Cancelar</button><button class="primary" data-m="yes">Guardar</button></div>', function(ok){
      if (!ok) return;
      var v = String(($('#rn') || {}).value || '').trim();
      if (v && v !== S.name) commit(function(st){ st.name = v; }, 'Nombre actualizado');
    }, 'sm');

  'chron-publish': function(){ var c = ui.chron; if (!c || !c.text) return; ui.chron = null; commit(function(st){ var t = st.tournaments.find(function(x){ return x.id === c.tid; }); if (t) t.chronicle = { text: c.text, date: today() }; }, 'Crónica publicada'); }
};

document.addEventListener('click', function(e){
  var m = e.target.closest('[data-m]');
  if (m) {
    var cb = modalCb; modalCb = null;
    if (cb) cb(m.dataset.m === 'yes');
    var o = $('#overlay'); if (o) o.remove();
    return;
  }
  if (e.target.id === 'overlay') { closeModal(); return; }
  var b = e.target.closest('[data-action]');
  if (!b) return;
  var fn = H[b.dataset.action];
  if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && $('#overlay')) closeModal();
  if (e.key === 'Enter' && e.target.id === 'rn') { var y = document.querySelector('[data-m="yes"]'); if (y) y.click(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('lbrow')) { e.preventDefault(); H.expand(e.target); }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.dataset.pe && ui.pe) { ui.pe[t.dataset.pe] = t.value; return; }
  if (t.dataset.mf && ui.mForm && (t.dataset.mf === 'note' || t.dataset.mf === 'margin' || t.dataset.mf === 'date')) { if (t.dataset.mf === 'margin') ui.mForm.final.margin = t.value; else ui.mForm[t.dataset.mf] = t.value; return; }
  if (t.dataset.he && ui.he) { ui.he[t.dataset.he] = t.value; return; }
  if (t.dataset.tf === 'name' && ui.tForm) { ui.tForm.name = t.value; return; }
  if (t.dataset.trDate != null && ui.tForm) { ui.tForm.rounds[Number(t.dataset.trDate)].date = t.value; return; }
  if (t.classList.contains('in-s') && ui.form) {
    var i = Number(t.dataset.i), raw = t.value.replace(/\D/g, '');
    if (raw !== t.value) t.value = raw;
    var v = raw === '' ? null : Number(raw);
    if (v !== null && (v < 1 || v > 20)) v = null;
    ui.form.scores[i] = v;
    var c = formCourse();
    t.className = 'in-s ' + (c ? markCls(v, c.pars[i]) : '');
    updateFormLive();
    var nx = null;
    if ((raw.length === 1 && v >= 2 && v <= 9) || raw.length === 2) nx = document.querySelector('.in-s[data-i="' + (i + 1) + '"]');
    if (nx && i < 17) { nx.focus(); nx.select(); }
  } else if (t.classList.contains('in-p') && ui.form && !t.dataset.cf) {
    var j = Number(t.dataset.i), rp = t.value.replace(/\D/g, '');
    if (rp !== t.value) t.value = rp;
    ui.form.putts[j] = rp === '' ? null : Math.min(9, Number(rp));
    updateFormLive();
    if (rp.length === 1 && j < 17) { var np = document.querySelector('.in-p[data-i="' + (j + 1) + '"]'); if (np) { np.focus(); np.select(); } }
  } else if (t.dataset.cf && ui.courseForm) {
    var k = t.dataset.cf;
    if (k === 'name') ui.courseForm.name = t.value;
    else {
      var ix = Number(t.dataset.i), rv = t.value.replace(/\D/g, '');
      if (rv !== t.value) t.value = rv;
      ui.courseForm[k === 'par' ? 'pars' : 'si'][ix] = rv === '' ? 0 : Number(rv);
      var cs = $('#cf-par'); if (cs) cs.textContent = sum(ui.courseForm.pars);
    }
  } else if (t.dataset.f === 'date' && ui.form) {
    ui.form.date = t.value;
  }
});
document.addEventListener('focusin', function(e){
  var t = e.target;
  if (t.matches && t.matches('.entry input')) { try { t.select(); } catch (x) {} }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.dataset.pe && ui.pe) { ui.pe[t.dataset.pe] = t.value; }
  else if (t.dataset.he && ui.he) { ui.he[t.dataset.he] = t.value; }
  else if (t.dataset.mf && ui.mForm) {
    var mk = t.dataset.mf, mf = ui.mForm;
    if (/^[ab][01]$/.test(mk)) mf[mk[0]][Number(mk[1])] = t.value;
    else if (mk === 'holesN') mf.holesN = Number(t.value);
    else if (mk === 'winner') mf.final.winner = t.value;
    else if (mk === 'courseId') mf.courseId = t.value;
    else return;
    render();
  }
  else if (t.id === 'pe-photo') {
    var pf = t.files && t.files[0]; if (!pf || !ui.pe) return;
    processPhoto(pf).then(function(d){ if (!ui.pe) return; ui.pe.photo = d; renderPlayerEditor(); }, function(){ toast('No se pudo leer esa imagen. Probá con un JPG o PNG.'); });
  }
  else if (t.dataset.tf && ui.tForm) {
    var k = t.dataset.tf;
    if (k === 'n') setRoundsCount(Number(t.value));
    else if (k === 'bestN') { ui.tForm.bestN = Number(t.value) || 0; }
    else if (k === 'courseId') { var old = course(ui.tForm.courseId); ui.tForm.courseId = t.value; if (old && ui.tForm.name.indexOf(old.name) >= 0) ui.tForm.name = ui.tForm.name.replace(old.name, course(t.value).name); render(); }
    else if (k === 'mode') ui.tForm.mode = t.value;
  }
  else if (t.dataset.trCounts != null && ui.tForm) { ui.tForm.rounds[Number(t.dataset.trCounts)].counts = t.checked; var sp = t.nextElementSibling; if (sp) sp.textContent = t.checked ? 'Cuenta' : 'No cuenta'; }
  else if (t.dataset.f && ui.form && (t.dataset.f === 'playerId' || t.dataset.f === 'tid' || t.dataset.f === 'fecha' || t.dataset.f === 'courseId')) {
    var f = ui.form;
    if (t.dataset.f === 'fecha') f.fecha = Number(t.value);
    else f[t.dataset.f] = t.value;
    var tt = f.tid ? tour(f.tid) : null;
    if (tt) f.courseId = tt.courseId;
    if (tt && (t.dataset.f === 'tid' || (!f.id && t.dataset.f === 'playerId'))) f.fecha = suggestRound(tt, f.playerId);
    if (!tt) { f.fecha = 0; if (!f.id && t.dataset.f === 'tid') f.date = today(); }
    if (tt && !f.id) { var rd = tt.rounds[f.fecha - 1]; if (rd && rd.date) f.date = rd.date; }
    render();
  }
  else if (t.dataset.stat === 'player') { ui.statPlayer = t.value; saveNav(); render(); }
  else if (t.dataset.stat === 'course') { ui.statCourse = t.value; saveNav(); render(); }
  else if (t.dataset.stat === 'tour') { ui.statTour = t.value; saveNav(); render(); }
  else if (t.dataset.stat === 'period') {
    ui.statPeriod = t.value;
    if (t.value === 'custom' && !ui.statFrom && !ui.statTo) { ui.statFrom = new Date().getFullYear() + '-01-01'; ui.statTo = today(); }
    saveNav(); render();
  }
  else if (t.dataset.stat === 'from') { ui.statFrom = t.value; saveNav(); render(); }
  else if (t.dataset.stat === 'to') { ui.statTo = t.value; saveNav(); render(); }
  else if (t.dataset.photo != null && ui.photo && ui.photo.found) { ui.photo.found[Number(t.dataset.photo)].playerId = t.value; }
  else if (t.id === 'photo-file') { var file = t.files && t.files[0]; if (file) readPhoto(file); }
  else if (t.id === 'import-file') {
    var imf = t.files && t.files[0]; if (!imf) return;
    imf.text().then(function(txt){
      var m = txt.match(/<script type="application\/json" id="state">([\s\S]*?)<\/script>/);
      var d = null; try { d = m ? normalize(JSON.parse(m[1])) : null; } catch (err) { d = null; }
      if (!d) { toast('Ese archivo no tiene datos del torneo.'); return; }
      var cnt = [plural(d.players.length, 'jugador', 'jugadores'), plural(d.courses.length, 'cancha', 'canchas'), plural(d.tournaments.length, 'torneo', 'torneos'), plural(d.rounds.length, 'tarjeta', 'tarjetas'), plural(d.matches.length, 'partido', 'partidos')].join(', ');
      askConfirm('Importar datos', 'El archivo trae ' + cnt + '. Si seguís, reemplaza todo lo que hay ahora en la página, para todos.', 'Importar y reemplazar', true).then(function(ok){
        if (!ok) return;
        ui.tid = null; ui.form = null; ui.profile = null;
        commit(function(st){ ['name','mode','players','courses','rounds','shots','tournaments','history','matches'].forEach(function(k){ st[k] = clone(d[k]); }); }, 'Datos importados');
      });
    });
    t.value = '';
  }
});

/* ---------- boot ---------- */
render();
var flash = ssGet('flash');
if (flash) { ssDel('flash'); toast(flash); }
apiGet(null).then(function(j){
  server.isProtected = !!j.protected;
  server.version = j.version || 0;
  if (j.state) { S = normalize(j.state); server.ready = true; render(); return; }
  // base vacía: se cargan los datos que trae este archivo como punto de partida
  server.ready = true;
  if (S.players.length || S.courses.length || S.rounds.length || S.tournaments.length) {
    apiPut(0, S).then(function(res){ if (res.status === 200) server.version = res.body.version; else if (res.status === 409) sync(true); });
  }
  render();
}, function(e){
  server.error = e.code || 'net';
  render();
});
if (hasClaude) {
  window.claude.use('sample').then(function(ns){
    sampleNS = ns;
    if (!ns) return;
    return ns.limits().then(function(l){ canImages = !!(l && l.images); }, function(){ canImages = false; }).then(render);
  }).catch(function(){});
  window.claude.use('user').then(function(u){
    if (!u || typeof u.canEdit !== 'function') return;
    return Promise.resolve(u.canEdit()).then(function(ce){ if (ce === false) { readOnly = true; render(); } });
  }).catch(function(){});
}
